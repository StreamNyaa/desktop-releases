name: Bug report
description: Report a desktop beta problem with enough detail to reproduce it.
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 'For security problems, use private vulnerability reporting. Never attach tokens, .env files, full backups, private tracker links, or entire log folders.'
  - type: input
    id: app_version
    attributes:
      label: StreamNyaa version
      placeholder: 0.1.15 — Public Beta 1
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: Windows version
      placeholder: Windows 11, version/build
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU / GPU, if relevant
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the title and episode/part for source, schedule, or timeline problems. Do not attach media.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or sanitized diagnostic excerpt
      description: Remove personal paths, emails, tokens, IPs, and private tracker passkeys before sharing.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked the known issues and removed sensitive information from this report.
          required: true
